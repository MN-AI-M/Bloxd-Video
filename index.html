<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Bloxd Replay Editor</title>
<style>
  html, body { margin:0; height:100%; background:#0d0d10; color:#eee; font-family: sans-serif; overflow:hidden; }

  /* --- アップロード画面 --- */
  #uploadScreen { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:16px; z-index:20; }
  #uploadScreen.hidden { display:none; }
  #uploadBox { background:#1a1a20; padding:32px 40px; border-radius:12px; text-align:center; max-width:420px; }
  #uploadBox h1 { font-size:20px; margin-bottom:8px; }
  #uploadBox p { color:#999; font-size:13px; margin-bottom:20px; }
  #uploadBox input[type=file] { color:#ccc; margin-bottom:16px; display:block; width:100%; }
  #processBtn { padding:12px 24px; border-radius:6px; border:none; background:#3498db; color:white; font-size:15px; cursor:pointer; width:100%; }
  #processBtn:disabled { background:#555; cursor:not-allowed; }
  #uploadStatus { margin-top:14px; font-size:13px; color:#aaa; min-height: 18px; white-space: pre-line; }

  /* --- エディタ画面(自由カメラのみ) --- */
  #editor { position:fixed; inset:0; display:none; }
  #editor.active { display:block; }

  #freecamArea { position:absolute; top:0; left:0; right:0; bottom:120px; background:#0d0d10; }
  #freecamCanvas { position:absolute; top:0; left:0; }
  #freecamCrosshair { position:absolute; top:50%; left:50%; width:6px; height:6px; margin:-3px 0 0 -3px;
                       border-radius:50%; background:rgba(255,255,255,0.7); pointer-events:none; }
  #freecamHint { position:absolute; bottom:12px; left:50%; transform:translateX(-50%);
                 background:rgba(0,0,0,0.65); color:#eee; padding:8px 14px; border-radius:6px;
                 font-size:13px; pointer-events:none; white-space:nowrap; }
  #freecamStatus { position:absolute; top:8px; left:8px; color:#ccc; font-size:13px;
                    background:rgba(0,0,0,0.6); padding:6px 10px; border-radius:6px; white-space:pre-line; }
  #loadStatus { position:absolute; top:44px; left:8px; color:#ccc; font-size:13px;
                background:rgba(0,0,0,0.6); padding:6px 10px; border-radius:6px; white-space:pre-line; }

  .topBtn { position:fixed; top:8px; z-index:10; padding:8px 14px; border-radius:6px; border:none; cursor:pointer; font-size:13px; color:white; }

  /* --- 撮影バー(カメラワークの記録・プレビュー・書き出し) --- */
  #filmBar { position:fixed; left:0; right:0; bottom:70px; height:50px; background:#15151c;
             border-top:1px solid #2a2a33; display:flex; align-items:center; padding:0 16px; gap:10px; z-index:10; }
  .filmBtn { padding:8px 14px; border-radius:6px; border:none; cursor:pointer; font-size:13px; color:white; background:#3a3a45; white-space:nowrap; }
  .filmBtn:disabled { opacity:0.4; cursor:not-allowed; }
  .filmBtnGhost { background:transparent; border:1px solid #444; }
  #recordBtn.recording { background:#c0392b; animation: filmPulse 1.4s ease-in-out infinite; }
  @keyframes filmPulse { 0%,100% { opacity:1; } 50% { opacity:0.55; } }
  #previewBtn.active { background:#8e44ad; }
  #filmDivider { flex:1; }
  #fovLabel { color:#aaa; font-size:12px; display:flex; align-items:center; gap:6px; white-space:nowrap; }
  #fovValue { min-width:32px; display:inline-block; }
  #exportStatus { color:#e67e22; font-size:12px; white-space:nowrap; }

  #bar { position:fixed; left:0; right:0; bottom:0; height:70px; background:#181820;
         border-top:1px solid #333; display:flex; align-items:center; padding:0 16px; gap:12px; z-index:10; }
  #playBtn { padding:10px 18px; border-radius:6px; border:none; background:#3498db; color:white; cursor:pointer; font-size:14px; }
  #scrubWrap { position:relative; flex:1; display:flex; align-items:center; }
  #scrub { width:100%; margin:0; }
  #pathOverlay { position:absolute; left:0; right:0; bottom:2px; height:4px; pointer-events:none; }
  #frameInfo { color:#aaa; font-size:12px; white-space:nowrap; min-width:340px; }
  #entitySelect { background:#222; color:#eee; border:1px solid #444; border-radius:6px; padding:8px; font-size:13px; max-width: 220px; }
</style>
</head>
<body>

<div id="uploadScreen">
  <div id="uploadBox">
    <h1>Bloxd Replay Editor</h1>
    <p>.bloxdreplay ファイルをアップロードすると、自由カメラでその場を歩き回りながらタイムライン再生ができます。<br>
       全部ブラウザの中だけで処理するので、どこにもアップロードされません。</p>
    <input type="file" id="fileInput" accept=".bloxdreplay">
    <button id="processBtn" disabled>読み込む準備中...</button>
    <div id="uploadStatus"></div>
  </div>
</div>

<div id="editor">
  <button id="gotoBtn" class="topBtn" style="right:8px; background:#e67e22;">📍 プレイヤーへ移動</button>

  <div id="freecamArea">
    <canvas id="freecamCanvas"></canvas>
    <div id="freecamCrosshair"></div>
    <div id="freecamStatus">-</div>
    <div id="loadStatus"></div>
    <div id="freecamHint">クリックしてマウス操作を開始 / WASD移動・Space上昇・Shift下降・マウスで視点 / Escでマウス解放</div>
  </div>

  <div id="filmBar">
    <button id="recordBtn" class="filmBtn" title="再生しながら自由カメラを操作すると、その動きがそのまま記録されます">🔴 記録開始</button>
    <button id="previewBtn" class="filmBtn" title="記録したカメラワークを自動再生して確認します" disabled>🎬 プレビュー</button>
    <button id="exportBtn" class="filmBtn" title="記録した範囲を動画ファイル(webm)として書き出します" disabled>💾 書き出す</button>
    <button id="clearPathBtn" class="filmBtn filmBtnGhost" title="記録したカメラワークを消します" disabled>🗑 記録を消す</button>
    <span id="filmDivider"></span>
    <label id="fovLabel">画角 <input type="range" id="fovSlider" min="30" max="110" value="70"><span id="fovValue">70°</span></label>
    <span id="exportStatus"></span>
  </div>

  <div id="bar">
    <button id="playBtn">▶ 再生</button>
    <div id="scrubWrap">
      <input type="range" id="scrub" min="0" max="0" value="0">
      <div id="pathOverlay"></div>
    </div>
    <select id="entitySelect"></select>
    <div id="frameInfo">-</div>
  </div>
</div>

<!-- Pyodide(ブラウザ内でPythonを動かす仕組み)は、メインスレッドを止めない
     よう別スレッド(pyodide-worker.js、Web Worker)の中で読み込む。
     このページ自体からはpyodide.jsを直接読み込む必要はない。
     サーバーへのアップロードは一切発生しない -->

<!-- textures.zip をブラウザ内で展開するためのライブラリ(個々のpng配布の代わり) -->
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>

<!-- 共有の状態・定数(面の形・タイムライン)は shared.js、
     描画・操作は freecam.js、UI(アップロード・Pyodide呼び出し)は ui.js -->
<script src="shared.js"></script>
<script src="freecam.js"></script>
<script src="ui.js"></script>
</body>
</html>
