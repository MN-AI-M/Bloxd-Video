<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bloxd Replay Editor</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap');

  :root {
    --bg: #0B0D12;
    --surface: #151821;
    --surface-2: #1D2129;
    --ink: #ECEAE3;
    --muted: #8B93A7;
    --border: #262B36;

    --gold: #E8A33D;      --gold-ink: #2A1B04;
    --emerald: #3ECF8E;   --emerald-ink: #04241A;

    --font-ui: 'Zen Kaku Gothic New', -apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif;
    --font-display: 'Bricolage Grotesque', var(--font-ui);
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  html { color-scheme: dark; }
  html, body { margin:0; height:100%; overflow:hidden; }
  body { background: var(--bg); color: var(--ink); font-family: var(--font-ui); -webkit-font-smoothing: antialiased; }

  .btn { display:inline-flex; align-items:center; gap:8px; border:none; border-radius:8px; padding:11px 20px;
         font-family: var(--font-ui); font-size:14.5px; font-weight:700; cursor:pointer;
         transition: filter .15s ease, transform .1s ease; }
  .btn:active { transform: translateY(1px); }
  .btn:disabled { opacity:.45; cursor:not-allowed; }
  .btn-primary { background: var(--gold); color: var(--gold-ink); }
  .btn-primary:hover:not(:disabled) { filter: brightness(1.08); }
  .btn-ghost { background: transparent; color: var(--ink); border:1px solid var(--border); }
  .btn-ghost:hover:not(:disabled) { border-color: var(--muted); }
  .btn-sm { padding:7px 13px; font-size:13px; border-radius:7px; }

  /* ============================================================
     アップロード画面
     ============================================================ */
  #uploadScreen { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; z-index:20;
                  background: radial-gradient(ellipse at 30% 20%, #171b26 0%, var(--bg) 55%); }
  #uploadScreen.hidden { display:none; }
  #uploadHero { display:flex; align-items:center; gap:56px; max-width:880px; padding:0 32px; }
  #uploadHero .copy { flex:1; min-width:0; }
  .eyebrow-word { font-family: var(--font-display); font-weight:700; font-size:13px; letter-spacing:.08em;
                  text-transform:uppercase; color: var(--emerald); margin:0 0 10px; }
  #uploadHero h1 { font-family: var(--font-display); font-size:36px; font-weight:800; line-height:1.25; margin:0 0 14px; letter-spacing:-0.01em; }
  #uploadHero .lead { color: var(--muted); font-size:15px; line-height:1.75; margin:0 0 26px; max-width:440px; }
  #uploadCard { background: var(--surface); border:1px solid var(--border); border-radius: var(--radius); padding:22px; max-width:440px; }
  #fileInput { color: var(--muted); font-size:13px; margin-bottom:14px; display:block; width:100%; }
  #processBtn { width:100%; justify-content:center; }
  #uploadStatus { margin-top:14px; font-size:13px; color: var(--muted); min-height:18px; white-space:pre-line; line-height:1.6; }
  #uploadHero .hero-art { flex-shrink:0; width:200px; }
  #uploadHero .hero-art svg { width:100%; height:auto; }

  /* ============================================================
     エディタ画面(ステップ1: 自由カメラで見るだけ)
     ============================================================ */
  #editor { position:fixed; inset:0; display:none; flex-direction:column; }
  #editor.active { display:flex; }

  #freecamArea { position:relative; flex:1; min-height:0; background:#08090c; }
  #freecamCanvas { position:absolute; top:0; left:0; }
  #freecamCrosshair { position:absolute; top:50%; left:50%; width:6px; height:6px; margin:-3px 0 0 -3px;
                       border-radius:50%; background:rgba(255,255,255,0.7); pointer-events:none; }
  #freecamHint { position:absolute; bottom:14px; left:50%; transform:translateX(-50%);
                 background:rgba(11,13,18,0.75); backdrop-filter: blur(4px); color: var(--ink); padding:8px 14px;
                 border-radius:8px; font-size:12.5px; pointer-events:none; white-space:nowrap; border:1px solid var(--border); }
  #freecamStatus { position:absolute; top:12px; left:12px; color: var(--ink); font-size:12.5px;
                    background:rgba(11,13,18,0.75); backdrop-filter: blur(4px); padding:7px 11px; border-radius:8px;
                    white-space:pre-line; border:1px solid var(--border); }
  #loadStatus { position:absolute; top:50px; left:12px; color: var(--muted); font-size:12.5px;
                background:rgba(11,13,18,0.75); backdrop-filter: blur(4px); padding:7px 11px; border-radius:8px;
                white-space:pre-line; border:1px solid var(--border); }

  /* 右上の操作群。今後ボタンが増えてもここに並べるだけで済むようflexにしてある */
  #topRightControls { position:absolute; top:12px; right:12px; z-index:5; display:flex; align-items:center; gap:8px; }
  #fovBox { display:flex; align-items:center; gap:8px;
            background:rgba(11,13,18,0.75); backdrop-filter: blur(4px); padding:7px 12px; border-radius:8px;
            border:1px solid var(--border); font-size:12px; color: var(--muted); }
  #fovValue { min-width:30px; display:inline-block; text-align:right; color: var(--ink); }

  /* ============================================================
     簡易トランスポート(再生・スクラブ。ブロック式タイムラインは後続ステップ)
     ============================================================ */
  #transportBar { flex-shrink:0; background: var(--surface); border-top:1px solid var(--border);
                   display:flex; align-items:center; gap:14px; padding:10px 16px; }
  #playBtn { flex-shrink:0; }
  #timecode { font-family: var(--font-display); font-variant-numeric: tabular-nums; font-size:13px; color: var(--muted); white-space:nowrap; }
  #scrubBar { flex:1; min-width:0; accent-color: var(--gold); }
  #entitySelect { background: var(--surface-2); color: var(--ink); border:1px solid var(--border); border-radius:7px;
                  padding:8px 10px; font-size:12.5px; max-width:180px; flex-shrink:0; }
  #frameInfo { color: var(--muted); font-size:11.5px; white-space:nowrap; flex-shrink:0; }
</style>
</head>
<body>

<div id="uploadScreen">
  <div id="uploadHero">
    <div class="copy">
      <p class="eyebrow-word">for Bloxd.io</p>
      <h1>リプレイを、<br>見せられる動画に。</h1>
      <p class="lead">
        .bloxdreplay ファイルをアップロードすると、ブラウザの中だけで自由カメラを
        動かしてその場を見て回れます。サーバーには何も送信されません。
      </p>
      <div id="uploadCard">
        <input type="file" id="fileInput" accept=".bloxdreplay">
        <button id="processBtn" class="btn btn-primary" disabled>読み込む準備中...</button>
        <div id="uploadStatus"></div>
      </div>
    </div>
    <div class="hero-art">
      <svg viewBox="0 0 160 160" aria-hidden="true">
        <g transform="translate(40,90)">
          <path d="M 0,-22 L 44,0 L 0,22 L -44,0 Z" fill="#3ECF8E"/>
          <path d="M -44,0 L 0,22 L 0,76 L -44,54 Z" fill="#2FA26E"/>
          <path d="M 44,0 L 0,22 L 0,76 L 44,54 Z" fill="#227A53"/>
        </g>
        <g transform="translate(120,90)">
          <path d="M 0,-22 L 44,0 L 0,22 L -44,0 Z" fill="#8B7FE8"/>
          <path d="M -44,0 L 0,22 L 0,76 L -44,54 Z" fill="#6C63B8"/>
          <path d="M 44,0 L 0,22 L 0,76 L 44,54 Z" fill="#4E4886"/>
        </g>
        <g transform="translate(80,44)">
          <path d="M 0,-22 L 44,0 L 0,22 L -44,0 Z" fill="#E8A33D"/>
          <path d="M -44,0 L 0,22 L 0,76 L -44,54 Z" fill="#B87F2E"/>
          <path d="M 44,0 L 0,22 L 0,76 L 44,54 Z" fill="#8F631F"/>
        </g>
      </svg>
    </div>
  </div>
</div>

<div id="editor">
  <div id="freecamArea">
    <canvas id="freecamCanvas"></canvas>
    <div id="freecamCrosshair"></div>
    <div id="freecamStatus">-</div>
    <div id="loadStatus"></div>
    <div id="topRightControls">
      <button id="gotoBtn" class="btn btn-ghost btn-sm">📍 プレイヤーへ移動</button>
      <div id="fovBox">画角 <input type="range" id="fovSlider" min="30" max="110" value="70"><span id="fovValue">70°</span></div>
    </div>
    <div id="freecamHint">クリックしてマウス操作を開始 / WASD移動・Space上昇・Shift下降・マウスで視点 / Escでマウス解放</div>
  </div>

  <div id="transportBar">
    <button id="playBtn" class="btn btn-primary btn-sm">▶ 再生</button>
    <div id="timecode">0:00 / 0:00</div>
    <input type="range" id="scrubBar" min="0" max="0" value="0">
    <select id="entitySelect"></select>
    <div id="frameInfo">-</div>
  </div>
</div>

<!-- Pyodide(ブラウザ内でPythonを動かす仕組み)は、メインスレッドを止めない
     よう別スレッド(pyodide-worker.js、Web Worker)の中で読み込む。
     このページ自体からはpyodide.jsを直接読み込む必要はない。
     サーバーへのアップロードは一切発生しない -->

<!-- textures.zip をブラウザ内で展開するためのライブラリ(個々のpng配布の代わり) -->
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>

<!-- 共有の状態・定数は shared.js、描画・操作は freecam.js、
     UI(アップロード・Pyodide呼び出し・再生)は ui.js -->
<script src="shared.js"></script>
<script src="freecam.js"></script>
<script src="ui.js"></script>
</body>
</html>
