<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bloxd Replay Editor</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap');

  :root {
    --bg: #0B0D12;
    --surface: #151821;
    --surface-2: #1D2129;
    --ink: #ECEAE3;
    --muted: #8B93A7;
    --border: #262B36;

    --gold: #E8A33D;      --gold-ink: #2A1B04;
    --emerald: #3ECF8E;   --emerald-ink: #04241A;
    --amethyst: #8B7FE8;  --amethyst-ink: #17123A;
    --slate: #5B8AC9;     --slate-ink: #0E1E31;

    --font-ui: 'Zen Kaku Gothic New', -apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif;
    --font-display: 'Bricolage Grotesque', var(--font-ui);
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  html { color-scheme: dark; }
  html, body { margin:0; height:100%; overflow:hidden; }
  body { background: var(--bg); color: var(--ink); font-family: var(--font-ui); -webkit-font-smoothing: antialiased; }

  .btn { display:inline-flex; align-items:center; gap:8px; border:none; border-radius:8px; padding:11px 20px;
         font-family: var(--font-ui); font-size:14.5px; font-weight:700; cursor:pointer;
         transition: filter .15s ease, transform .1s ease; }
  .btn:active { transform: translateY(1px); }
  .btn:disabled { opacity:.45; cursor:not-allowed; }
  .btn-primary { background: var(--gold); color: var(--gold-ink); }
  .btn-primary:hover:not(:disabled) { filter: brightness(1.08); }
  .btn-ghost { background: transparent; color: var(--ink); border:1px solid var(--border); }
  .btn-ghost:hover:not(:disabled) { border-color: var(--muted); }
  .btn-sm { padding:7px 13px; font-size:13px; border-radius:7px; }
  .btn-icon { padding:8px; border-radius:7px; background:var(--surface-2); color:var(--ink); border:1px solid var(--border); }
  .btn-icon:hover:not(:disabled) { border-color: var(--muted); }

  /* ============================================================
     アップロード画面(home.htmlのヒーローに寄せた作り)
     ============================================================ */
  #uploadScreen { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; z-index:20;
                  background: radial-gradient(ellipse at 30% 20%, #171b26 0%, var(--bg) 55%); }
  #uploadScreen.hidden { display:none; }
  #uploadHero { display:flex; align-items:center; gap:56px; max-width:880px; padding:0 32px; }
  #uploadHero .copy { flex:1; min-width:0; }
  .eyebrow-word { font-family: var(--font-display); font-weight:700; font-size:13px; letter-spacing:.08em;
                  text-transform:uppercase; color: var(--emerald); margin:0 0 10px; }
  #uploadHero h1 { font-family: var(--font-display); font-size:36px; font-weight:800; line-height:1.25; margin:0 0 14px; letter-spacing:-0.01em; }
  #uploadHero .lead { color: var(--muted); font-size:15px; line-height:1.75; margin:0 0 26px; max-width:440px; }
  #uploadCard { background: var(--surface); border:1px solid var(--border); border-radius: var(--radius); padding:22px; max-width:440px; }
  #fileInput { color: var(--muted); font-size:13px; margin-bottom:14px; display:block; width:100%; }
  #processBtn { width:100%; justify-content:center; }
  #uploadStatus { margin-top:14px; font-size:13px; color: var(--muted); min-height:18px; white-space:pre-line; line-height:1.6; }
  #uploadHero .hero-art { flex-shrink:0; width:200px; }
  #uploadHero .hero-art svg { width:100%; height:auto; }

  /* ============================================================
     エディタ画面
     ============================================================ */
  #editor { position:fixed; inset:0; display:none; flex-direction:column; }
  #editor.active { display:flex; }

  #freecamArea { position:relative; flex:1; min-height:0; background:#08090c; }
  #freecamCanvas { position:absolute; top:0; left:0; }
  #freecamCrosshair { position:absolute; top:50%; left:50%; width:6px; height:6px; margin:-3px 0 0 -3px;
                       border-radius:50%; background:rgba(255,255,255,0.7); pointer-events:none; }
  #freecamHint { position:absolute; bottom:14px; left:50%; transform:translateX(-50%);
                 background:rgba(11,13,18,0.75); backdrop-filter: blur(4px); color: var(--ink); padding:8px 14px;
                 border-radius:8px; font-size:12.5px; pointer-events:none; white-space:nowrap; border:1px solid var(--border); }
  #freecamStatus { position:absolute; top:12px; left:12px; color: var(--ink); font-size:12.5px;
                    background:rgba(11,13,18,0.75); backdrop-filter: blur(4px); padding:7px 11px; border-radius:8px;
                    white-space:pre-line; border:1px solid var(--border); }
  #loadStatus { position:absolute; top:50px; left:12px; color: var(--muted); font-size:12.5px;
                background:rgba(11,13,18,0.75); backdrop-filter: blur(4px); padding:7px 11px; border-radius:8px;
                white-space:pre-line; border:1px solid var(--border); }
  #gotoBtn { position:absolute; top:12px; right:12px; z-index:5; }
  #fovBox { position:absolute; top:12px; right:150px; z-index:5; display:flex; align-items:center; gap:8px;
            background:rgba(11,13,18,0.75); backdrop-filter: blur(4px); padding:7px 12px; border-radius:8px;
            border:1px solid var(--border); font-size:12px; color: var(--muted); }
  #fovValue { min-width:30px; display:inline-block; text-align:right; color: var(--ink); }

  /* --- タイムラインパネル(マルチトラック) --- */
  #timelinePanel { flex-shrink:0; background: var(--surface); border-top:1px solid var(--border);
                    display:flex; flex-direction:column; height:236px; user-select:none; }

  #transportRow { display:flex; align-items:center; gap:14px; padding:8px 16px; border-bottom:1px solid var(--border); }
  #playBtn { flex-shrink:0; }
  #timecode { font-family: var(--font-display); font-variant-numeric: tabular-nums; font-size:13px; color: var(--muted); white-space:nowrap; }
  #entitySelect { background: var(--surface-2); color: var(--ink); border:1px solid var(--border); border-radius:7px;
                  padding:8px 10px; font-size:12.5px; max-width:160px; flex-shrink:0; }
  #transportSpacer { flex:1; }
  #frameInfo { color: var(--muted); font-size:11.5px; white-space:nowrap; }
  #zoomBox { display:flex; align-items:center; gap:4px; flex-shrink:0; }
  #previewBtn.active { background: var(--amethyst); color: var(--amethyst-ink); }

  #tracksScroll { flex:1; overflow:auto; position:relative; }
  #tracksInner { position:relative; }

  #rulerRow { position:sticky; top:0; display:flex; height:22px; background: var(--surface); z-index:3;
              border-bottom:1px solid var(--border); }
  .ruler-label-spacer { width:96px; flex-shrink:0; position:sticky; left:0; z-index:2;
                         background: var(--surface); border-right:1px solid var(--border); }
  #rulerTicks { position:relative; flex:1; min-width:0; height:100%; }
  .ruler-mark { position:absolute; top:0; bottom:0; border-left:1px solid var(--border); padding-left:4px;
                font-size:10px; color: var(--muted); line-height:22px; white-space:nowrap; pointer-events:none; }

  .track-row { position:relative; height:46px; display:flex; border-bottom:1px solid var(--border); }
  .track-label { position:sticky; left:0; z-index:2; width:96px; flex-shrink:0; background: var(--surface);
                 border-right:1px solid var(--border); display:flex; align-items:center; justify-content:space-between;
                 padding:0 10px; font-size:12.5px; gap:6px; }
  .track-label .name { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .track-label .addBtn { flex-shrink:0; width:22px; height:22px; border-radius:6px; border:none; cursor:pointer;
                          font-size:14px; line-height:1; display:flex; align-items:center; justify-content:center; }
  .track-lane { position:relative; flex:1; min-width:0; }
  .track-row.disabled-track .track-label { color: var(--muted); }
  .track-row.disabled-track .addBtn { background: var(--surface-2); color: var(--muted); cursor:not-allowed; }
  .track-soon { position:absolute; left:12px; top:50%; transform:translateY(-50%); font-size:11px; color: var(--muted); }

  #playhead { position:absolute; top:0; bottom:0; width:2px; background: var(--gold); z-index:4; pointer-events:none; }
  #playhead::before { content:''; position:absolute; top:-1px; left:50%; transform:translateX(-50%);
                       width:0; height:0; border-left:6px solid transparent; border-right:6px solid transparent;
                       border-top:7px solid var(--gold); }

  .tblock { position:absolute; top:5px; bottom:5px; border-radius:7px; cursor:grab; overflow:hidden;
            border:1.5px solid transparent; }
  .tblock:active { cursor:grabbing; }
  .tblock.selected { border-color: var(--ink); }
  .tblock .handle { position:absolute; top:0; bottom:0; width:8px; cursor:ew-resize; }
  .tblock .handle.left { left:0; } .tblock .handle.right { right:0; }
  .tblock .tblock-label { position:absolute; left:9px; top:5px; font-size:11px; font-weight:700; color:#fff;
                           pointer-events:none; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; right:9px; }
  .tblock .tblock-sub { position:absolute; left:9px; bottom:4px; font-size:9.5px; color:rgba(255,255,255,0.75);
                         pointer-events:none; white-space:nowrap; }
  .tblock.recording-live { animation: tblockPulse 1s ease-in-out infinite; }
  @keyframes tblockPulse { 0%,100% { filter:brightness(1); } 50% { filter:brightness(1.4); } }

  /* ============================================================
     ブロック編集パネル(右からスライド、左端をドラッグして幅調整)
     ============================================================ */
  #editPanel { position:fixed; top:0; right:0; bottom:0; width:340px; background: var(--surface);
               border-left:1px solid var(--border); z-index:15; display:none; flex-direction:column;
               box-shadow: -8px 0 24px rgba(0,0,0,0.35); }
  #editPanel.open { display:flex; }
  #editPanelResizer { position:absolute; left:-5px; top:0; bottom:0; width:10px; cursor:ew-resize; z-index:2; }
  #editPanelResizer:hover, #editPanelResizer.dragging { background: rgba(232,163,61,0.25); }
  #editPanelHeader { display:flex; align-items:center; justify-content:space-between; padding:16px 18px;
                      border-bottom:1px solid var(--border); }
  #editPanelHeader h2 { font-family: var(--font-display); font-size:15px; margin:0; }
  #editPanelClose { background:none; border:none; color: var(--muted); font-size:18px; cursor:pointer; line-height:1; padding:4px; }
  #editPanelClose:hover { color: var(--ink); }
  #editPanelBody { flex:1; overflow-y:auto; padding:18px; display:flex; flex-direction:column; gap:16px; }
  .fieldRow { display:flex; flex-direction:column; gap:6px; }
  .fieldRow label { font-size:12px; color: var(--muted); }
  .fieldRow .value { font-family: var(--font-display); font-variant-numeric: tabular-nums; font-size:14px; }
  #editPanelBody .btn { width:100%; justify-content:center; }
  #recordStatusLine { font-size:12.5px; color: var(--muted); min-height:18px; }
  #deleteBlockBtn { color:#e06060; border-color:#4a2222; }
  #deleteBlockBtn:hover { border-color:#e06060; }
</style>
</head>
<body>

<div id="uploadScreen">
  <div id="uploadHero">
    <div class="copy">
      <p class="eyebrow-word">for Bloxd.io</p>
      <h1>リプレイを、<br>見せられる動画に。</h1>
      <p class="lead">
        .bloxdreplay ファイルをアップロードすると、ブラウザの中だけで自由カメラを
        動かして撮影できます。タイムラインでカメラワークを組み立てて、そのまま
        動画として書き出せます。サーバーには何も送信されません。
      </p>
      <div id="uploadCard">
        <input type="file" id="fileInput" accept=".bloxdreplay">
        <button id="processBtn" class="btn btn-primary" disabled>読み込む準備中...</button>
        <div id="uploadStatus"></div>
      </div>
    </div>
    <div class="hero-art">
      <svg viewBox="0 0 160 160" aria-hidden="true">
        <g transform="translate(40,90)">
          <path d="M 0,-22 L 44,0 L 0,22 L -44,0 Z" fill="#3ECF8E"/>
          <path d="M -44,0 L 0,22 L 0,76 L -44,54 Z" fill="#2FA26E"/>
          <path d="M 44,0 L 0,22 L 0,76 L 44,54 Z" fill="#227A53"/>
        </g>
        <g transform="translate(120,90)">
          <path d="M 0,-22 L 44,0 L 0,22 L -44,0 Z" fill="#8B7FE8"/>
          <path d="M -44,0 L 0,22 L 0,76 L -44,54 Z" fill="#6C63B8"/>
          <path d="M 44,0 L 0,22 L 0,76 L 44,54 Z" fill="#4E4886"/>
        </g>
        <g transform="translate(80,44)">
          <path d="M 0,-22 L 44,0 L 0,22 L -44,0 Z" fill="#E8A33D"/>
          <path d="M -44,0 L 0,22 L 0,76 L -44,54 Z" fill="#B87F2E"/>
          <path d="M 44,0 L 0,22 L 0,76 L 44,54 Z" fill="#8F631F"/>
        </g>
      </svg>
    </div>
  </div>
</div>

<div id="editor">
  <div id="freecamArea">
    <canvas id="freecamCanvas"></canvas>
    <div id="freecamCrosshair"></div>
    <div id="freecamStatus">-</div>
    <div id="loadStatus"></div>
    <button id="gotoBtn" class="btn btn-ghost btn-sm">📍 プレイヤーへ移動</button>
    <div id="fovBox">画角 <input type="range" id="fovSlider" min="30" max="110" value="70"><span id="fovValue">70°</span></div>
    <div id="freecamHint">クリックしてマウス操作を開始 / WASD移動・Space上昇・Shift下降・マウスで視点 / Escでマウス解放</div>
  </div>

  <div id="timelinePanel">
    <div id="transportRow">
      <button id="playBtn" class="btn btn-primary btn-sm">▶ 再生</button>
      <div id="timecode">0:00 / 0:00</div>
      <select id="entitySelect"></select>
      <div id="transportSpacer"></div>
      <div id="frameInfo">-</div>
      <div id="zoomBox">
        <button id="zoomOutBtn" class="btn btn-icon btn-sm">－</button>
        <button id="zoomInBtn" class="btn btn-icon btn-sm">＋</button>
      </div>
      <button id="previewBtn" class="btn btn-ghost btn-sm" disabled>🎬 プレビュー</button>
      <button id="exportBtn" class="btn btn-primary btn-sm" disabled>💾 書き出す</button>
      <span id="exportStatus"></span>
    </div>
    <div id="tracksScroll">
      <div id="tracksInner">
        <div id="rulerRow"><div class="ruler-label-spacer"></div><div id="rulerTicks"></div></div>
        <div id="tracksBody"></div>
        <div id="playhead"></div>
      </div>
    </div>
  </div>
</div>

<div id="editPanel">
  <div id="editPanelResizer"></div>
  <div id="editPanelHeader">
    <h2 id="editPanelTitle">ブロックを編集</h2>
    <button id="editPanelClose">✕</button>
  </div>
  <div id="editPanelBody"></div>
</div>

<!-- Pyodide(ブラウザ内でPythonを動かす仕組み)は、メインスレッドを止めない
     よう別スレッド(pyodide-worker.js、Web Worker)の中で読み込む。
     このページ自体からはpyodide.jsを直接読み込む必要はない。
     サーバーへのアップロードは一切発生しない -->

<!-- textures.zip をブラウザ内で展開するためのライブラリ(個々のpng配布の代わり) -->
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>

<!-- 共有の状態・定数(面の形・タイムライン)は shared.js、
     マルチトラックタイムラインの制御は timeline.js、
     描画・操作は freecam.js、UI(アップロード・Pyodide呼び出し)は ui.js -->
<script src="shared.js"></script>
<script src="freecam.js"></script>
<script src="timeline.js"></script>
<script src="ui.js"></script>
</body>
</html>
